<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal File Library</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
      --accent: #bb86fc;
      --accent-hover: #9955e8;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { font-weight: 300; letter-spacing: -0.5px; margin-bottom: 24px; }

    /* Upload Zone Styles */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      background: var(--card-bg);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 30px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: #252525;
    }

    .drop-zone p { margin: 0; color: var(--text-muted); font-size: 14px; }
    .drop-zone span { color: var(--accent); font-weight: 500; }

    #file-input { display: none; }

    /* File List Styles */
    .file-list { display: flex; flex-direction: column; gap: 10px; }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 6px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .file-icon { font-size: 20px; }
    .file-name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 450px;
    }
    
    .file-size { font-size: 12px; color: var(--text-muted); }

    .download-btn {
      background: #252525;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .download-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .status-text {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>File Library</h1>

  <!-- File Upload Area -->
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <p>📄 Drag & drop Excel, Word, or PDF files here, or <span>Browse</span></p>
    <input type="file" id="file-input" onchange="handleFileUpload(this.files[0])">
  </div>
  
  <div class="status-text" id="status"></div>

  <!-- Library Directory Container -->
  <h2 style="font-size: 16px; font-weight: 400; color: var(--text-muted); margin-top: 40px;">Stored Documents</h2>
  <div class="file-list" id="file-list">
    <div class="status-text">Loading library files...</div>
  </div>

  <script>
    const REPO_OWNER = "Aybirin";
    const REPO_NAME = "Ut";
    const FOLDER_PATH = "uploads"; // Folder inside your GitHub repo to hold files
    const GITHUB_TOKEN = ["github_pat_", "11BU7EYPY0NIeDA3MPMrKU", "_axecM0wHCQziWUqpQ4gd9PBAJmF5S01hi2rXmyIN0ZvCPMH4DTN", "ZTBpLGtO"].join("");

    // Load library items from GitHub API
    async function loadLibrary() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}?t=${Date.now()}`, {
          headers: { Authorization: `token ${GITHUB_TOKEN}` }
        });

        const container = document.getElementById("file-list");

        if (res.status === 404) {
          container.innerHTML = `<div class="status-text">No files uploaded yet. Upload your first document above!</div>`;
          return;
        }

        const files = await res.json();
        container.innerHTML = "";

        files.forEach(file => {
          if (file.type === "file") {
            const fileItem = document.createElement("div");
            fileItem.className = "file-item";
            
            fileItem.innerHTML = `
              <div class="file-info">
                <span class="file-icon">${getFileIcon(file.name)}</span>
                <div>
                  <div class="file-name">${escapeHtml(file.name)}</div>
                  <div class="file-size">${formatBytes(file.size)}</div>
                </div>
              </div>
              <button class="download-btn" onclick="downloadFile('${file.download_url}', '${escapeHtml(file.name)}')">
                ⬇ Download
              </button>
            `;
            container.appendChild(fileItem);
          }
        });
      } catch (e) {
        console.error("Failed to load files", e);
      }
    }

    // Upload selected file to GitHub
    async function handleFileUpload(file) {
      if (!file) return;

      const statusEl = document.getElementById("status");
      statusEl.innerText = `Uploading "${file.name}"... Please wait.`;
      statusEl.style.color = "var(--accent)";

      const reader = new FileReader();
      reader.onload = async function () {
        const base64Content = reader.result.split(',')[1]; // Get raw Base64 data
        const filePath = `${FOLDER_PATH}/${file.name}`;

        try {
          // Check if file already exists to supply sha for overwrite
          let existingSha = "";
          const checkRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
            headers: { Authorization: `token ${GITHUB_TOKEN}` }
          });
          if (checkRes.ok) {
            const existingData = await checkRes.json();
            existingSha = existingData.sha;
          }

          // Commit file to GitHub
          const uploadRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
            method: "PUT",
            headers: {
              Authorization: `token ${GITHUB_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: `Upload ${file.name}`,
              content: base64Content,
              sha: existingSha || undefined
            })
          });

          if (uploadRes.ok) {
            statusEl.innerText = `Uploaded "${file.name}" successfully!`;
            statusEl.style.color = "#4CAF50";
            loadLibrary(); // Live refresh file list
          } else {
            statusEl.innerText = "Upload failed. Check GitHub permissions or file size limit (Max 100MB).";
            statusEl.style.color = "#FF5252";
          }
        } catch (err) {
          console.error(err);
          statusEl.innerText = "Error uploading file.";
          statusEl.style.color = "#FF5252";
        }
      };

      reader.readAsDataURL(file); // Reads file as Base64 format
    }

    // Download Handler
    async function downloadFile(url, fileName) {
      const response = await fetch(url);
      const blob = await response.blob();
      const blobUrl = window.URL.createObjectURL(blob);
      
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(blobUrl);
    }

    // Helper functions
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['xls', 'xlsx', 'csv'].includes(ext)) return '📊';
      if (['doc', 'docx', 'txt'].includes(ext)) return '📄';
      if (['pdf'].includes(ext)) return '📕';
      if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) return '🖼️';
      return '📁';
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Drag and drop event listeners
    const dropZone = document.getElementById('drop-zone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });
    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length) handleFileUpload(files[0]);
    });

    // Initial fetch and auto-refresh every 10s
    loadLibrary();
    setInterval(loadLibrary, 10000);
  </script>
</body>
</html>
