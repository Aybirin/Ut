<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Notes</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
      --accent: #bb86fc;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { font-weight: 300; letter-spacing: -0.5px; }

    .control-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, textarea, button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus, textarea:focus { outline: 1px solid var(--accent); }

    button {
      cursor: pointer;
      background: #252525;
      transition: background 0.2s;
    }
    button:hover { background: #333; }

    .folder {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      background: var(--card-bg);
      overflow: hidden;
    }

    details summary {
      padding: 14px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    details summary::-webkit-details-marker { display: none; }

    .folder-content {
      padding: 0 14px 14px 14px;
      border-top: 1px solid var(--border);
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      resize: vertical;
      box-sizing: border-box;
    }

    .status {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: right;
    }
  </style>
</head>
<body>

  <h1>Notes</h1>

  <div class="control-panel">
    <input type="text" id="folder-title" placeholder="New folder name..." style="flex: 1;">
    <button onclick="addFolder()">Add Folder</button>
  </div>

  <div id="notes-container"></div>

  <script>
    const REPO_OWNER = "Aybirin";
    const REPO_NAME = "Ut";
    const FILE_PATH = "copy.json";
    const GITHUB_TOKEN = ["github_pat_", "11BU7EYPY0NIeDA3MPMrKU", "_axecM0wHCQziWUqpQ4gd9PBAJmF5S01hi2rXmyIN0ZvCPMH4DTN", "ZTBpLGtO"].join("");

    let notesData = [];
    let fileSha = "";
    
    // Variables to track UI state so we don't disrupt the user
    let openFolders = {}; 
    let focusedFolderId = null; 
    let saveTimeout = null;

    async function loadNotes() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?t=${Date.now()}`, {
          headers: { Authorization: `token ${GITHUB_TOKEN}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        fileSha = data.sha;
        
        const newData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        
        // Only update local data if the user isn't actively typing
        if (!focusedFolderId) {
          notesData = newData;
          render();
        }
      } catch (e) {
        console.error("Failed to load notes", e);
      }
    }

    async function saveNotes() {
      const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(notesData, null, 2))));
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            Authorization: `token ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Live update copy.json notes",
            content: contentEncoded,
            sha: fileSha
          })
        });
        const resData = await res.json();
        if (resData.content) {
            fileSha = resData.content.sha;
        }
      } catch (e) {
        console.error("Failed to save to GitHub", e);
      }
    }

    function render() {
      // 1. Save the open/closed state of existing folders before redrawing
      document.querySelectorAll('details').forEach(details => {
        const id = details.getAttribute('data-id');
        if (id) openFolders[id] = details.open;
      });

      const container = document.getElementById("notes-container");
      container.innerHTML = "";

      notesData.forEach((folder, index) => {
        const folderEl = document.createElement("div");
        folderEl.className = "folder";
        
        // 2. Restore open state if it was open previously
        const isOpen = openFolders[folder.id] ? "open" : "";

        folderEl.innerHTML = `
          <details data-id="${folder.id}" ${isOpen}>
            <summary>
              <span>📁 ${escapeHtml(folder.title)}</span>
              <span style="font-size: 12px; color: var(--text-muted);">Click to toggle</span>
            </summary>
            <div class="folder-content">
              <textarea 
                onfocus="focusedFolderId = ${folder.id}" 
                onblur="focusedFolderId = null"
                oninput="updateNote(${index}, this.value)"
              >${escapeHtml(folder.content)}</textarea>
              <div class="status" id="status-${index}">Saved</div>
            </div>
          </details>
        `;
        container.appendChild(folderEl);
      });
    }

    function addFolder() {
      const input = document.getElementById("folder-title");
      const title = input.value.trim();
      if (!title) return;

      const newId = Date.now();
      notesData.push({ id: newId, title: title, content: "" });
      openFolders[newId] = true; // Auto-open new folders
      input.value = "";
      
      render();
      saveNotes();
    }

    function updateNote(index, text) {
      notesData[index].content = text;
      const statusEl = document.getElementById(`status-${index}`);
      statusEl.innerText = "Typing...";
      statusEl.style.color = "var(--accent)";

      // Clear the previous timeout if the user keeps typing
      clearTimeout(saveTimeout);
      
      // Wait 1 second after the user STOPS typing to save to GitHub (Prevents GitHub rate-limiting)
      saveTimeout = setTimeout(() => {
        statusEl.innerText = "Saving to GitHub...";
        saveNotes().then(() => {
          statusEl.innerText = "Saved";
          statusEl.style.color = "var(--text-muted)";
        });
      }, 1000); 
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial load and background sync
    loadNotes();
    setInterval(loadNotes, 10000); // Continues to sync background changes across devices safely
  </script>
</body>
</html>
